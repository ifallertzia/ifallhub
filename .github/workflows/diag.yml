name: Diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose build failure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "diag"
      - name: Formatting diff
        if: always()
        run: |
          set +e
          cargo fmt --check > /tmp/fmt.log 2>&1
          echo "fmt exit: $?"
          head -n 60 /tmp/fmt.log | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
      - name: Build errors
        if: always()
        run: |
          set +e
          cargo build --all-features --locked --message-format=short > /tmp/build.log 2>&1
          status=$?
          echo "build exit: $status"
          grep -E "error(\[|:)" /tmp/build.log | head -n 20 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
