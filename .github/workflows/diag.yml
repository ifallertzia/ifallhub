name: Diag

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    name: Diagnose build failure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "diag"
      - name: Formatting and build
        run: |
          set +e
          cargo fmt --check > /tmp/fmt.log 2>&1
          echo "fmt exit: $?"
          cargo build --all-features --locked --message-format=short > /tmp/build.log 2>&1
          echo "build exit: $?"
          cargo clippy --all-targets --all-features --locked -- -D warnings > /tmp/clippy.log 2>&1
          echo "clippy exit: $?"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Diag'
            echo '```'
            echo '--- fmt ---'
            head -n 60 /tmp/fmt.log 2>/dev/null
            echo '--- build ---'
            grep -E "error|warning: unused" /tmp/build.log 2>/dev/null | head -n 40
            echo '--- build tail ---'
            tail -n 20 /tmp/build.log 2>/dev/null
            echo '--- clippy ---'
            grep -E "^(error|warning)" /tmp/clippy.log 2>/dev/null | head -n 40
            echo '```'
          } > /tmp/diag.md
          gh pr comment "${PR}" --body-file /tmp/diag.md
