name: Arena verify (temporary)

# Temporary helper used while authoring this branch in a sandbox without a Rust
# toolchain: it reports rustfmt diffs and failing test names back on the PR.
# Remove before merging.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: arena-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Rust fmt + full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: arena-verify
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: rustfmt diff for the changed Rust files
        run: |
          set -o pipefail
          rustfmt --check --edition 2024 \
            src/library.rs src/web_api.rs src/config.rs src/lib.rs 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' > /tmp/fmt.log || true
          echo "fmt diff bytes: $(wc -c < /tmp/fmt.log)"

      - name: Full test suite
        env:
          MOVIEBOX_CONFIG_DIR: ${{ runner.temp }}/mb_config
          MOVIEBOX_DATA_DIR: ${{ runner.temp }}/mb_data
        run: |
          set -o pipefail
          cargo nextest run --all-features --locked --no-fail-fast > /tmp/tests.raw.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' /tmp/tests.raw.log > /tmp/tests.clean.log
          {
            echo "failures:"
            grep -E 'FAIL' /tmp/tests.clean.log | tail -n 40 || true
            echo ""
            echo "summary:"
            grep -E 'Summary|tests run|error' /tmp/tests.clean.log | tail -n 10 || true
          } > /tmp/tests.log
          cat /tmp/tests.log

      - name: Clippy for the changed files
        run: |
          set -o pipefail
          cargo clippy --message-format=short --all-targets --all-features --locked -- -D warnings 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | grep -E '^(src|error|warning)' | tail -n 60 > /tmp/clippy.log || true
          cat /tmp/clippy.log

      - name: Report on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Arena verify · rustfmt + targeted tests'
            echo ''
            echo '```'
            echo '--- rustfmt --check (changed files) ---'
            head -c 24000 /tmp/fmt.log 2>/dev/null || echo '(clean)'
            echo ''
            echo '--- cargo nextest (full suite) ---'
            cat /tmp/tests.log 2>/dev/null || echo '(no output)'
            echo ''
            echo '--- clippy ---'
            cat /tmp/clippy.log 2>/dev/null || echo '(clean)'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
