name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-hygiene"
      - name: Run web tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Verify Vercel config scripts resolve
        run: |
          # The web suite checks vercel.json references; this keeps the shell
          # entrypoints parseable even if npm is skipped.
          for script in deploy/vercel-*.sh; do
            sh -n "$script"
          done
      - name: Check Rust formatting
        run: |
          set +e
          cargo fmt --check > /tmp/cargo-fmt.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/cargo-fmt.log
            {
              echo '### cargo fmt --check output'
              echo '```text'
              cat /tmp/cargo-fmt.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Validate Unix installer syntax
        run: |
          if [ -f install.sh ]; then
            bash -n install.sh
          else
            echo "install.sh is not in the repository; skipping syntax check"
          fi
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          if (-not (Test-Path "install.ps1")) {
            Write-Output "install.ps1 is not in the repository; skipping syntax check"
            exit 0
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - run: cargo check --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Install musl compiler tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify musl target compilation
        run: cargo check --locked --target x86_64-unknown-linux-musl
      - name: Audit dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: |
          set +e
          cargo audit > /tmp/cargo-audit.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/cargo-audit.log
            details=$(tail -n 100 /tmp/cargo-audit.log | tr '\n' ' ')
            details=${details//%/%25}
            details=${details//$'\r'/%0D}
            echo "::error title=cargo audit failure::$details"
            exit "$status"
          fi
      - name: Verify package
        run: cargo package --locked
      - name: Verify documentation build
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Test mdBook build
        run: |
          cp CHANGELOG.md docs/changelog.md && cp CONTRIBUTING.md docs/contributing.md
          mdbook build

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-build-test-${{ matrix.os }}"
      - run: cargo build --all-features --locked
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run test suite with isolated configuration
        env:
          MOVIEBOX_CONFIG_DIR: ${{ runner.temp }}/mb_config
          MOVIEBOX_DATA_DIR: ${{ runner.temp }}/mb_data
        run: cargo nextest run --all-features --locked
      - name: Smoke-test binary startup
        run: cargo run --all-features --locked -- --version
