<!doctype html>
<html lang="en" data-theme="dark" suppresshydrationwarning>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Ifallhub — Watch movies and series across sources with instant streaming, subtitles, VLC handoff, and downloads."
    />
    <title>Ifallhub — Movies &amp; Series</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff5b6e'/%3E%3Cstop offset='100%25' stop-color='%23fa233b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='8.5' fill='url(%23g)'/%3E%3Cpath d='M14 10.5v15l12-7.5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('ifallhub_theme') || 'dark';
        var resolved =
          t === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : t;
        document.documentElement.dataset.theme = resolved === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased">
    <div id="app"></div>
    <div id="sheets-root"></div>
    <div id="toasts-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
